<section class="home-hero">
    <div class="hero-text">
      <h1>Discover your next favorite movie.</h1>
      <p>
        Browse trending titles, explore details, read the blog and build your personal favorites collection.
      </p>
  
      <div class="hero-actions">
        <a routerLink="/movies" class="btn-primary">Browse Movies</a>
        <a routerLink="/blog" class="btn-secondary">Read Blog</a>
      </div>
    </div>
  
    <div class="hero-highlight">
      <h2>Trending this week</h2>
      <div class="hero-movie-grid">
        <div class="hero-movie-card" *ngFor="let movie of trendingMovies | slice:0:4">
          <div class="poster-skeleton" *ngIf="!movie.poster_path"></div>
          <img *ngIf="movie.poster_path"
               [src]="'https://image.tmdb.org/t/p/w300' + movie.poster_path"
               [alt]="movie.title" />
          <div class="hero-movie-info">
            <h3>{{ movie.title }}</h3>
            <span class="badge-rating">{{ movie.vote_average | number:'1.1-1' }}</span>
          </div>
        </div>
      </div>
    </div>
  </section>
