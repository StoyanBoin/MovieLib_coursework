<section class="auth-wrapper">
    <div class="auth-card">
      <h1>Register</h1>
      <p class="subtitle">Create an account to save favorites and more.</p>
  
      <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
        <label>
          Name
          <input type="text"
                 name="name"
                 required
                 [(ngModel)]="form.name" />
        </label>
  
        <label>
          Email
          <input type="email"
                 name="email"
                 required
                 [(ngModel)]="form.email" />
        </label>
  
        <label>
          Password
          <input type="password"
                 name="password"
                 required
                 minlength="6"
                 [(ngModel)]="form.password" />
        </label>
  
        <button class="btn-primary full" [disabled]="registerForm.invalid">
          Create account
        </button>
  
        <p class="auth-switch">
          Already have an account?
          <a routerLink="/login">Login</a>
        </p>
      </form>
    </div>
  </section>
