<section class="page-header">
    <h1>Blog</h1>
    <p>Short articles and notes about movies, genres and recommendations.</p>
  </section>
  
  <section class="blog-grid">
    <article class="blog-card" *ngFor="let post of posts">
      <h2>{{ post.title }}</h2>
      <p class="meta">Published {{ post.date | date:'mediumDate' }}</p>
      <p class="excerpt">{{ post.excerpt }}</p>
      <button class="link-button" (click)="openPost(post)">Read more</button>
    </article>
  </section>
