<section class="auth-wrapper">
    <div class="auth-card">
      <h1>Login</h1>
      <p class="subtitle">Access your favorites and personalized content.</p>
  
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <label>
          Email
          <input type="email"
                 name="email"
                 required
                 [(ngModel)]="form.email" />
        </label>
  
        <label>
          Password
          <input type="password"
                 name="password"
                 required
                 minlength="6"
                 [(ngModel)]="form.password" />
        </label>
  
        <button class="btn-primary full" [disabled]="loginForm.invalid">
          Login
        </button>
  
        <p class="auth-switch">
          Don't have an account?
          <a routerLink="/register">Register</a>
        </p>
      </form>
    </div>
  </section>
