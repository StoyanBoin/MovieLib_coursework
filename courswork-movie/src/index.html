<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Charset -->
  <meta charset="UTF-8">

  <!-- Viewport (mobile responsive) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>MovieLib – Discover Movies & Series</title>
  <meta name="description"
    content="MovieLib is a modern movie and series library where you can browse trending films, explore details, read blog posts, and manage your favorites.">
  <meta name="keywords" content="movies, series, imdb, film library, movie database, angular project, cinema, tv shows">
  <meta name="author" content="Stoyan">

  <!-- Robots -->
  <meta name="robots" content="index, follow">

  <!-- Theme color (browser UI color) -->
  <meta name="theme-color" content="#050816">

  <!-- Open Graph (Facebook, LinkedIn) -->
  <meta property="og:title" content="MovieLib – Discover Movies & Series">
  <meta property="og:description" content="Browse movies, explore details, read blog posts and save your favorites.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://your-domain.com/">
  <meta property="og:image" content="https://your-domain.com/assets/preview.jpg">
  <meta property="og:site_name" content="MovieLib">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MovieLib – Discover Movies & Series">
  <meta name="twitter:description" content="Your personal movie and series library.">
  <meta name="twitter:image" content="https://your-domain.com/assets/preview.jpg">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <!-- Manifest (PWA support) -->
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">

  <!-- Preconnect for faster API calls -->
  <link rel="preconnect" href="https://api.themoviedb.org">
  <link rel="preconnect" href="https://image.tmdb.org">

</head>

<body>
  <app-root></app-root>
</body>

</html>
