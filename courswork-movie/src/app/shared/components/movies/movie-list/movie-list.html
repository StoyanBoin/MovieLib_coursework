<section class="page-header">
    <h1>Movies</h1>
    <p>Browse and filter through the movie collection.</p>
  </section>
  
  <section class="movie-grid">
    @for (movie of movies; track movie._id) {
      <app-movie-item [movie]="movie"/>
    }
    @if (movies.length === 0) {
      <p class="no-movies">No movies available.</p>
    }
  </section>
