<section class="new-movie-wrapper">

    <div class="new-movie-card">

        <h1 class="title">Add New Movie</h1>

        <form #movieForm="ngForm" (ngSubmit)="onSubmit()">

            <div class="form-group">
                <label for="movieName">Movie Name</label>
                <input appInputError id="movieName" type="text" [(ngModel)]="movieName"
                    placeholder="Enter movie name..." required minlength="5" #movieNameInput="ngModel"
                    [class.input-error]="movieNameInput.invalid && movieNameInput.touched" />
            </div>

            @if (movieNameInput.touched && movieNameInput.errors?.['required']) {
            <div class="error-message">
                Movie name is required and must be at least 5 characters long.
            </div>
            }
            @if (movieNameInput.touched && movieNameInput.errors?.['minlength']) {
            <div class="error-message">
                Movie name must be at least 5 characters long.
            </div>
            }

            <div class="form-group">
                <label for="imageUrl">Image URL</label>
                <input appInputErrorid="imageUrl" type="text" [(ngModel)]="imageUrl"
                    placeholder="https://example.com/poster.jpg" />
            </div>

            <div class="form-group">
                <label for="subscribers">Subscribers</label>
                <input appInputError id="subscribers" type="text" [(ngModel)]="subscribers"
                    placeholder="Enter subscriber names..." />
            </div>

            <div class="actions">
                <button class="btn-primary" type="submit" [disabled]="movieForm.invalid || isLoading">
                    {{ isLoading ? 'Adding...' : 'Add Movie' }}
                </button>

                <button class="btn-cancel" type="button" (click)="onCancel()">
                    Cancel
                </button>
            </div>


        </form>

    </div>

</section>
