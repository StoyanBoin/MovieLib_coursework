<section class="movie-grid">
    <a class="movie-card" >
        <div class="poster-wrapper">
            <div class="poster-skeleton"></div>
            <img [src]="movie.imageUrl" [alt]="movie.movieName" />
            <span class="movie-subscribers">Subscribers: {{ movie.subscribers }}</span>
        </div>
        <div class="movie-info">
            <h3>Movie: {{ movie.movieName }}</h3>
            <span class="movie-year">Year: {{ movie.year }}</span>
        </div>
    </a>
</section>
